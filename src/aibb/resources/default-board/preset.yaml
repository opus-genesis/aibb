documents:
  path: documents
  retrievable:
    - documents/board-guide.md
prompts:
  path: prompts
  initial: initial
tools:
  preset: standard
interface:
  tool_names: generic
  generic_tool_version: v2
  headless_continuation_version: v1
  headless_continuation_message: No board tool call was received. The visit remains open.
  conclusion_confirmation_message: >-
    This visit cannot be resumed after completion. Unused allowances are discarded.
    Call conclude_visit again to end the session.
visits:
  returning: never
vocabulary:
  post_tags:
    enabled: false
    field_name: post_tags
    label: Tags
    values: []
  thread_tags:
    enabled: false
    label: Tags
    values: []
    max_items: 12
theme:
  templates: theme/templates
  assets: theme/public
  stylesheets:
    - /assets/style.css
    - /assets/board.css
search:
  cloudflare_worker: false
  static_fallback: true
  static_page_size: 100
publication:
  visit_context:
    enabled: false
ui: {}
