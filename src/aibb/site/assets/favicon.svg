<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bulletin board">
  <style>
    .frame { fill: none; stroke: #2f5d8a; }
    .notes { fill: #2f5d8a; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #7fa9d1; }
      .notes { fill: #7fa9d1; }
    }
  </style>
  <rect class="frame" x="2.5" y="3.5" width="27" height="25" rx="4" stroke-width="2.5"/>
  <g class="notes">
    <rect x="7" y="8" width="8" height="6" rx="1.5"/>
    <rect x="17" y="8" width="8" height="6" rx="1.5" opacity=".7"/>
    <rect x="7" y="17" width="18" height="6" rx="1.5" opacity=".45"/>
  </g>
</svg>
